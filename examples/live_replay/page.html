<!doctype html>
<meta charset="utf-8">
<title>CDP 流控制 + 实时重放</title>
<link rel="stylesheet" href="/vendor/rrweb.css">
<script src="/vendor/rrweb.js"></script>
<style>
  :root{--bg:#14171c;--fg:#e6e9ef;--dim:#8b93a1;--line:#2a2f38;--ok:#5aa96b;--warn:#e0a94b}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
       font:14px/1.5 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif}
  header{display:flex;gap:10px;align-items:center;padding:8px 14px;
         border-bottom:1px solid var(--line);flex:none}
  input[type=url]{flex:1;min-width:0;background:#0e1116;color:var(--fg);
       border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
  button{background:#242a33;color:var(--fg);border:1px solid var(--line);
       border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
  button:hover{background:#2e3540}
  .dim{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  main{flex:1;display:flex;flex-direction:column;min-height:0}
  .half{display:flex;flex-direction:column;min-height:0}
  /* **上下各一半。** 画面按 4:3 在自己那一半里居中,剩下的全给 viewer ——
     第一版画面顶满、viewer 只剩一行,什么都看不见 */
  .half.top{flex:0 0 52%}
  .half.bot{flex:1 1 auto}
  .bar{display:flex;justify-content:space-between;align-items:baseline;
       padding:6px 14px;flex:none}
  .bar b{font-size:13px}
  .wrap{flex:1;min-height:0;display:flex;justify-content:center;padding:0 14px 10px}
  .stage{position:relative;height:100%;aspect-ratio:1024/768;background:#fff;
         border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .stage img{position:absolute;inset:0;width:1024px;height:768px;transform-origin:0 0}
  .hit{position:absolute;inset:0;cursor:crosshair;outline:0}
  .hit:focus-visible{box-shadow:inset 0 0 0 2px var(--ok)}
  iframe{flex:1;border:1px solid var(--line);border-radius:8px;margin:0 14px 14px;
         background:#fff;min-height:280px}
  /* rrweb 的 Replayer 会自己按录到的视口尺寸建一层 wrapper —— 我们只负责缩放 */
  #rr{flex:1;min-height:0;margin:0 14px 14px;background:#fff;border:1px solid var(--line);
      border-radius:8px;overflow:hidden;position:relative}
  #rr .replayer-wrapper{position:absolute;top:0;left:0;transform-origin:0 0}
  #rr iframe{border:0;margin:0;border-radius:0}
  .hidden{display:none !important}
  .pill{background:#242a33;border:1px solid var(--line);border-radius:999px;
        padding:2px 9px;font-size:12px}
</style>

<header>
  <b style="font-weight:600;white-space:nowrap">CDP 流控制</b>
  <input type="url" id="url" placeholder="换个网址,回车">
  <button id="go">打开</button>
  <span class="pill" id="conn">连接中…</span>
</header>

<main>
  <div class="half top">
    <div class="bar">
      <b>① 你在这里操作 —— 鼠标、滚轮、键盘都送进同一个 tab</b>
      <span class="dim" id="fps">—</span>
    </div>
    <div class="wrap">
      <div class="stage"><img id="screen" alt=""><div class="hit" id="hit" tabindex="0"></div></div>
    </div>
  </div>
  <div class="half bot">
    <div class="bar">
      <b id="btitle">②</b>
      <span class="dim" id="tstat">等第一批事件…</span>
    </div>
    <div id="rr" class="hidden"></div>
    <iframe id="viewer" class="hidden"></iframe>
  </div>
</main>

<script>
const MODE = "__MODE__";
const $ = s => document.querySelector(s);
const screenEl = $("#screen"), hit = $("#hit"), viewer = $("#viewer"), rrBox = $("#rr");
let frames = 0, t0 = Date.now(), bytes = { rr: 0, frame: 0 };
const rate = (n, s) => `${(n / 1024).toFixed(0)} KB · ${(n / s / 1024).toFixed(1)} KB/s`;

if (MODE === "rrweb") {
  rrBox.classList.remove("hidden");
  $("#btitle").textContent = "② rrweb 实时重放 —— 页面一动它就跟着动";
} else {
  viewer.classList.remove("hidden");
  viewer.src = "__VIEWER__";
  $("#btitle").textContent = "② Playwright Trace —— 每做完一个动作它就多一条";
}

function fit() {
  const w = screenEl.parentElement.clientWidth;
  screenEl.style.transform = `scale(${w / 1024})`;
}
addEventListener("resize", fit);
new ResizeObserver(fit).observe(screenEl.parentElement);   // 高度变了宽度也跟着变
fit();

const ws = new WebSocket(location.origin.replace(/^http/, "ws") + "/ws");
ws.onopen  = () => $("#conn").textContent = "已连接";
ws.onclose = () => $("#conn").textContent = "断开了";
const send = o => ws.readyState === 1 && ws.send(JSON.stringify(o));

ws.onmessage = ev => {
  const m = JSON.parse(ev.data);
  if (m.c === "frame") {
    screenEl.src = "data:image/jpeg;base64," + m.data;
    frames++;
    bytes = m.b || bytes;
    const s = Math.max(1, (Date.now() - t0) / 1000);
    $("#fps").textContent =
      `${frames} 帧 · ${(frames / s).toFixed(1)} fps · ${rate(bytes.frame, s)}`;
  } else if (m.c === "trace") {
    $("#tstat").textContent = `${m.n} 个动作` + (m.last ? ` · 最后一个:${m.last}` : "");
    loadTrace(m.v);
  } else if (m.c === "rr") {
    bytes = m.b || bytes;
    feed(JSON.parse(m.e));
  }
};

// ---- rrweb:live 模式,一条一条喂 ----
// **它是流,不是包。** 这正是它比 trace 顺的原因:trace 每次都要重拼整份再整份塞回去。
let replayer = null, pending = [], rrCount = 0;

function scaleRR(w, h) {
  const b = rrBox.getBoundingClientRect();
  const k = Math.min(b.width / w, b.height / h);
  const wrap = rrBox.querySelector(".replayer-wrapper");
  if (wrap) {
    wrap.style.transform = `scale(${k})`;
    wrap.style.left = ((b.width - w * k) / 2) + "px";
  }
}
let vw = 1024, vh = 768;
new ResizeObserver(() => scaleRR(vw, vh)).observe(rrBox);

function feed(e) {
  rrCount++;
  const secs = Math.max(1, (Date.now() - t0) / 1000);
  $("#tstat").textContent = `${rrCount} 个事件 · ${rate(bytes.rr, secs)}`;
  if (e.type === 4) {                       // Meta:新的一页,推倒重来
    if (replayer) { try { replayer.destroy(); } catch (_) {} replayer = null; }
    rrBox.innerHTML = "";
    vw = e.data.width || 1024; vh = e.data.height || 768;
    pending = [e];
    return;
  }
  if (!replayer) {
    pending.push(e);
    if (e.type !== 2) return;               // 等到 FullSnapshot 才建得起来
    replayer = new rrweb.Replayer(pending, {
      root: rrBox, liveMode: true, mouseTail: false,
      UNSAFE_replayCanvas: true, insertStyleRules: [],
    });
    replayer.startLive(pending[0].timestamp);
    pending = [];
    scaleRR(vw, vh);
    return;
  }
  replayer.addEvent(e);
}

if (MODE === "rrweb") {                     // 补上连接之前攒的那一段
  fetch("/rr/events").then(r => r.json()).then(d => {
    for (const raw of d.events) feed(JSON.parse(raw));
  }).catch(() => {});
}

// **把 trace 原地塞进 viewer,不 reload。**
// viewer 自己听 message:{method:"load", params:{trace: Blob}} —— 见它的 index bundle。
let loading = false, queued = null;
async function loadTrace(v) {
  if (loading) { queued = v; return; }
  loading = true;
  try {
    const r = await fetch("/trace.zip?v=" + v);
    if (r.ok) {
      const blob = await r.blob();
      viewer.contentWindow.postMessage({ method: "load", params: { trace: blob } }, "*");
    }
  } catch (e) { console.warn("trace 没load上", e); }
  loading = false;
  if (queued !== null) { const q = queued; queued = null; loadTrace(q); }
}

// ---- 输入:全部翻译成 Input.*,一条路 ----
const at = e => {
  const r = hit.getBoundingClientRect();
  return { x: (e.clientX - r.left) * 1024 / r.width,
           y: (e.clientY - r.top) * 768 / r.height };
};
let moveAt = 0;
hit.addEventListener("mousemove", e => {          // 移动别刷爆,25ms 一个
  const now = Date.now();
  if (now - moveAt < 25) return;
  moveAt = now;
  send({ t: "mouse", type: "mouseMoved", ...at(e) });
});
hit.addEventListener("mousedown", e => { hit.focus(); send({ t: "mouse", type: "mousePressed", ...at(e), buttons: 1 }); });
hit.addEventListener("mouseup",   e => send({ t: "mouse", type: "mouseReleased", ...at(e), buttons: 0 }));
hit.addEventListener("contextmenu", e => e.preventDefault());
hit.addEventListener("wheel", e => {
  e.preventDefault();
  send({ t: "wheel", ...at(e), dx: e.deltaX, dy: e.deltaY });
}, { passive: false });

// 键盘只在画面被选中时转发 —— 否则下面 viewer 里的操作会被抢走
hit.addEventListener("keydown", e => {
  e.preventDefault();
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) send({ t: "text", text: e.key });
  else send({ t: "key", key: e.key, code: e.code, vk: e.keyCode });
});

$("#go").onclick = () => send({ t: "nav", url: $("#url").value });
$("#url").addEventListener("keydown", e => {
  e.stopPropagation();
  if (e.key === "Enter") $("#go").click();
});
</script>
