[project]
name = "webmuxd"
dynamic = ["version"]
description = "tmux + ttyd for a browser: a persistent Chromium you can watch and drive"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Twwy", email = "twwy.zh@gmail.com" }]
keywords = ["browser", "automation", "chromium", "cdp", "screencast", "rbi", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/memory-co/webmuxd"
Source = "https://github.com/memory-co/webmuxd"

[project.scripts]
webmuxd = "webmuxd.cli:main"

[build-system]
requires = ["setuptools>=68"]
# **打包前先建浏览器端。** `webmuxd/_client/` 不在 git 里,是构建产物 ——
# 接在这一刻,"忘了先构建"那种漏就不可能发生(docs/v2/works/j-layout.md §4.3)。
build-backend = "backend"
backend-path = ["_build"]

[tool.setuptools.dynamic]
version = { attr = "webmuxd.__version__" }

[tool.setuptools.packages.find]
include = ["webmuxd*"]

[tool.setuptools.package-data]
# **`_client/*`,不是 `_client/*.html`。** 0.6.0 加了两个 .js(xpra 客户端),
# 按后缀列的话它们不会进 wheel —— 而这种漏**只在干净安装上才现形**:
# 开发机上跑的是源码目录,一切正常。写成通配,以后加 css/svg 也不会再漏一次。
#
# `_client/` 是浏览器端那份的落地处(原 `webmuxd/view/static/`)。
"webmuxd" = ["_client/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test.py", "test_*.py"]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: 真起进程/容器的用例"]
