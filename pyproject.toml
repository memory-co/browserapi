[project]
name = "webmuxd"
version = "0.4.2"
description = "tmux + ttyd for a browser: a persistent Chromium you can watch and drive"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Twwy", email = "twwy.zh@gmail.com" }]
keywords = ["browser", "automation", "chromium", "cdp", "vnc", "agent", "kasm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/memory-co/webmuxd"
Source = "https://github.com/memory-co/webmuxd"

[project.scripts]
webmuxd = "webmuxd.cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["webmuxd*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test.py", "test_*.py"]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: 真起进程/容器的用例"]
