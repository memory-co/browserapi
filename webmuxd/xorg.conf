# 这是 webmuxd 自己的 X 配置,**不看发行版那份**(和 xpra.py 里 xvfb() 同一个道理)。
#
# 为什么要 dummy 驱动而不是 Xvfb:虚拟显示必须能**改尺寸**,不然像素对不齐。
# Xvfb 改不了 —— 它整个显示只有一个 RANDR 模式,`xrandr --newmode` 静默无效、
# `--fb` 直接 BadValue。dummy 可以:任意模式加得上、切得动,屏幕真跟着变。
#
# 观看端报上来多大,xpra 就把显示调成多大(`--resize-display=yes`),
# 全屏的 chrome 跟着显示走 —— 这就是像素对齐的那条链。

Section "ServerFlags"
  Option "DontVTSwitch" "on"
  Option "AllowMouseOpenFail" "on"
  Option "PciForceNone" "on"
  Option "AllowEmptyInput" "on"
  Option "AutoEnableDevices" "off"
  Option "AutoAddDevices" "off"
EndSection

Section "Device"
  Identifier "webmuxd-card"
  Driver "dummy"
  # **`DacSpeed` 和 `VideoRam` 是关键字,不是 `Option`。** 写成 Option 的下场
  # 是 Xorg 起到一半 "no screens found",而日志里不会说是因为它。
  DacSpeed 30000
  Option "ConstantDPI" "true"
  # kB。这是上限不是预分配。够装下底下那个 Virtual(4096*2304*4 = 37MB)还有富余。
  VideoRam 131072
EndSection

Section "Monitor"
  Identifier "webmuxd-monitor"
  # 放到最宽 —— 我们要的模式是运行时按观看端的窗口算出来的怪尺寸,
  # 卡在同步范围上就切不过去。
  HorizSync   1.0 - 300000.0
  VertRefresh 1.0 - 300.0
EndSection

Section "Screen"
  Identifier "webmuxd-screen"
  Device "webmuxd-card"
  Monitor "webmuxd-monitor"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    # 头一个是起始模式 —— **没人看的时候显示就这么大**,和默认分辨率同一个数。
    Modes "1024x768" "1280x800" "1366x768" "1440x900" "1600x900" "1680x1050" "1920x1080" "1920x1200" "2560x1600" "3840x2160"
    # 画面能长到多大的上限。screen.py 那儿把尺寸夹在 4096 以内。
    Virtual 4096 2304
  EndSubSection
EndSection
