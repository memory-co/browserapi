<!doctype html>
<meta charset="utf-8">
<title>webmuxd</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  内置观看页面 —— docs/v2/works/04-one-port.md §2。

  **它不是"界面"**:画面 + 一条 tab 条 + 一个地址栏,没有会话列表、没有登录页、
  没有设置面板、没有仪表盘。存在的唯一理由是「跑起来之后用浏览器打开这个地址,
  链路通没通一眼就看出来」。

  上层要自己画就自己画 —— 用的是同一组接口(WS /channel/cdp 拿帧,/api/tabs 拿 tab 表),
  这里没有私货。
-->
<style>
  :root {
    --bg: #1b1f23; --bar: #24292f; --line: #32383f; --ink: #e6edf3;
    --dim: #8b949e; --accent: #2f81f7; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  #tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: var(--bar);
    overflow-x: auto; scrollbar-width: thin; }
  .tab { display: flex; align-items: center; gap: 6px; max-width: 200px;
    padding: 6px 10px; border-radius: 6px 6px 0 0; background: #2d333b;
    color: var(--dim); cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
  .tab.on { background: var(--bg); color: var(--ink); }
  .tab span { overflow: hidden; text-overflow: ellipsis; }
  .tab b { font-weight: 400; opacity: .5; padding: 0 2px; }
  .tab b:hover { opacity: 1; }
  #newtab { padding: 6px 12px; color: var(--dim); cursor: pointer; flex: 0 0 auto; }

  #bar { display: flex; gap: 8px; align-items: center; padding: 6px 8px;
    background: var(--bar); border-bottom: 1px solid var(--line); }
  #bar button { background: none; border: 0; color: var(--dim); cursor: pointer;
    font-size: 15px; padding: 2px 6px; border-radius: 4px; }
  #bar button:hover { background: #32383f; color: var(--ink); }
  #url { flex: 1; min-width: 0; padding: 5px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: #0d1117; color: var(--ink);
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #ro { color: var(--warn); font-size: 11px; white-space: nowrap; }

  #stage { flex: 1; display: grid; place-items: center; overflow: auto; padding: 10px; }
  /* DOM 那条画面。**只读是结构性的**:重放出来的整棵 DOM 不接事件,
     所有输入落在 #screen3 上,再翻译成 Input.*(c §7)。 */
  #screen3 { position: relative; background: #fff; overflow: hidden; outline: 0; }
  #paintbox { position: absolute; inset: 0; overflow: hidden; }
  #screen3 .replayer-wrapper, #screen3 iframe {
    pointer-events: none !important; user-select: none !important;
    transform-origin: 0 0; border: 0; }
  #screen, #screen2 { display: block; background: #000; image-rendering: auto;
    outline: none; user-select: none; -webkit-user-drag: none; }
  #screen.dead, #screen2.dead { opacity: .35; }
  #screen2[hidden], #screen[hidden] { display: none; }

  #status { display: flex; gap: 16px; padding: 4px 10px; background: var(--bar);
    border-top: 1px solid var(--line); color: var(--dim);
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #status b { color: var(--ink); font-weight: 500; }
  #status .bad { color: var(--warn); }
  #ime { position: fixed; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

  /* 六类原生 UI —— headless 里它们不渲染,所以这一层是我们画的(works/06 §2③) */
  /* **不透明,不是半透明。** xpra 那条路上画面里是一个**有头的** chromium,
     它自己也会把 JS 对话框画出来,而那一份的按钮 CDP 的鼠标事件点不动
     (works/12 §11)。挡不住它,人就会看见两个对话框、点错那个死的。
     两个 transport 一套行为,所以两边都不透明。 */
  #modal { position: fixed; inset: 0; display: none; place-items: center;
    background: #000; z-index: 9; }
  #modal.on { display: grid; }
  .card { background: var(--bar); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px; min-width: 320px; max-width: 460px; }
  .card h3 { margin: 0 0 4px; font-size: 13px; color: var(--dim); font-weight: 500; }
  .card p { margin: 0 0 14px; white-space: pre-wrap; word-break: break-word; }
  .card input[type=text], .card input[type=file] { width: 100%; padding: 6px 8px;
    margin-bottom: 12px; background: #0d1117; color: var(--ink);
    border: 1px solid var(--line); border-radius: 5px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  .row button { padding: 5px 14px; border-radius: 5px; border: 1px solid var(--line);
    background: #2d333b; color: var(--ink); cursor: pointer; font-size: 13px; }
  .row button.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  #toasts { position: fixed; right: 12px; bottom: 34px; display: flex;
    flex-direction: column; gap: 6px; z-index: 8; }
  .toast { background: var(--bar); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; max-width: 320px; }
  .toast a { color: var(--accent); }
</style>

<div id="tabs"></div>

<div id="bar">
  <button id="back" title="后退">←</button>
  <button id="fwd" title="前进">→</button>
  <button id="reload" title="刷新">⟳</button>
  <input id="url" spellcheck="false" placeholder="输入网址回车">
  <span id="ro" hidden>只读</span>
</div>

<div id="stage"><img id="screen" alt=""><canvas id="screen2" hidden></canvas><div id="screen3" hidden><div id="paintbox"></div></div></div>

<div id="status">
  <span>帧 <b id="s-fps">0</b> fps</span>
  <span><b id="s-kbps">0</b> kbps</span>
  <span>画质 <b id="s-q">–</b></span>
  <span>RTT <b id="s-rtt">–</b></span>
  <span>帧 <b id="s-size">–</b></span>
  <span>有效缩放 <b id="s-zoom">–</b></span>
  <span id="s-conn">连接中…</span>
</div>

<div id="modal"><div class="card" id="card"></div></div>
<div id="toasts"></div>

<textarea id="ime" autocomplete="off"></textarea>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const img = $("screen"), cvs = $("screen2"), ime = $("ime");
  const dom3 = $("screen3"), paintbox = $("paintbox");
  // **画面在哪个元素上。** screencast 是 <img>,xpra 是 <canvas> ——
  // 除了这一处,下面所有代码对两者一视同仁(works/11 §5)。
  let screenEl = img, xpra = null, replayer = null, rrPending = [];
  const qs = new URLSearchParams(location.search);
  const token = qs.get("t") || "";
  // token 会进历史和 Referer,进来之后就抹掉(works/04 §4)
  if (token) history.replaceState({}, "", location.pathname);
  const auth = token ? "?t=" + encodeURIComponent(token) : "";

  let ws = null, writable = false, castW = 1024, castH = 768;
  let frameW = 0, frameH = 0, url = null, tabs = [], active = null;
  let frames = 0, bytes = 0, composing = false;

  // ---------------------------------------------------------------- 帧
  // 28 字节头 + 图片裸字节(works/02 §1)。castSessionId / targetId 对不上就丢 ——
  // 切 tab 的瞬间管道里还有旧 tab 的帧,不丢会闪一下。
  let castId = 0, targetHex = "", lastFrameId = 0, ackTimer = null;
  const hex = (dv, off) => {
    let s = "";
    for (let i = 0; i < 4; i++) s += dv.getUint32(off + i * 4, true).toString(16).padStart(8, "0");
    return s;
  };

  function onFrame(buf) {
    const dv = new DataView(buf);
    const cast = dv.getUint32(0, true), fid = dv.getUint32(4, true), target = hex(dv, 8);
    if (castId && cast < castId) return;          // 旧的一轮,丢
    castId = cast;
    if (targetHex && target !== targetHex) return;
    lastFrameId = fid;
    frames++; bytes += buf.byteLength;
    const blob = new Blob([new Uint8Array(buf, 28)], { type: "image/jpeg" });
    const next = URL.createObjectURL(blob);
    if (url) URL.revokeObjectURL(url);
    url = next;
    img.src = url;
    ackNow(fid);                                  // 环 B —— 背压就靠它
  }

  // ack 立即发、带帧号、不搭车(works/09 §6.3)——它是 RTT 探针,一排队就测不准。
  // 另外每收一帧重置一个 3 秒心跳:某一帧要是丢在路上,客户端永远等不到、
  // 也就永远不 ack,服务端额度耗尽就是永久卡死。补一发就自愈了(§6.4)。
  function ackNow(fid) {
    send({ type: "ack", frameId: fid });
    clearTimeout(ackTimer);
    ackTimer = setTimeout(() => ackNow(lastFrameId), 3000);
  }

  // ---------------------------------------------------------------- 连接
  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host + "/channel/cdp" + auth);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => { $("s-conn").textContent = "已连接"; $("s-conn").className = ""; };
    ws.onmessage = (e) => {
      if (typeof e.data !== "string") return onFrame(e.data);
      const m = JSON.parse(e.data);
      if (m.type === "dom") { return feedDom(JSON.parse(m.e)); }
      if (m.type === "hello") {
        writable = !!m.writable;
        $("ro").hidden = writable;
        if (m.transport === "vnc" && !xpra) startXpra();
        if (m.transport === "dom") startDom();
        if (m.w) setSize(m.w, m.h);
        if (!xpra) sendSize();          // xpra 的尺寸是 X 显示定的,问也没用
      } else if (m.type === "cast") {
        setSize(m.w, m.h);
        $("s-q").textContent = m.quality;
        targetHex = "";
      // meta 里的 deviceWidth/Height 是 **CSS 尺寸**,dsf>1 时和真实帧尺寸对不上
      // ——所以帧尺寸和有效缩放都以解码出来的那张图为准(见 img.onload)。
      } else if (m.type === "quality") {
        $("s-q").textContent = m.quality + (m.every_nth > 1 ? " /" + m.every_nth : "");
      } else if (m.type === "cursor") {
        screenEl.style.cursor = m.cursor;         // 服务端已经过白名单
      }
    };
    ws.onclose = () => {
      clearTimeout(ackTimer);
      $("s-conn").textContent = "断开,重连中…"; $("s-conn").className = "bad";
      screenEl.classList.add("dead");
      setTimeout(connect, 1000);
    };
  }
  const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

  // ---------------------------------------------------- 输入批量(e §4.3)
  // **移动和滚轮攒 25ms 一批,同一批里只留最后一个 move。**
  // 一秒几十个 mousemove,逐个发是在给自己制造排队 —— 而中间那些位置
  // 没有任何人关心,只有最后那个是"鼠标现在在哪"。
  //
  // **按下、抬起、按键不进批。** 25ms 在点击上能感觉出来,而且 down 和 up
  // 之间插 25ms,有的页面会判成长按。
  //
  // **回执永远不进批**(§4.1)—— 它是 RTT 探针,一排队就测不准。
  let pendMove = null, pendWheel = null, batchTimer = null;
  function flushInput() {
    batchTimer = null;
    if (pendMove) { send(pendMove); pendMove = null; }
    if (pendWheel) { send(pendWheel); pendWheel = null; }
  }
  function queueInput(o) {
    if (o.event === "move") pendMove = o;              // 只留最后一个
    else if (o.type === "wheel") {
      // 滚轮要**累加**,不能只留最后一个 —— 丢掉的每一格都是真滚过的距离
      pendWheel = pendWheel
        ? { ...o, dx: (pendWheel.dx || 0) + (o.dx || 0),
                  dy: (pendWheel.dy || 0) + (o.dy || 0) }
        : o;
    } else { send(o); return; }
    if (!batchTimer) batchTimer = setTimeout(flushInput, 25);
  }
  // 按下之前先把攒着的位置发掉,否则远端收到的"点击位置"是上一个采样点
  function sendNow(o) { flushInput(); send(o); }

  // ------------------------------------------------------------ DOM 那条画面路
  // **只换画面从哪来。** 输入、光标、tab、原生 UI 上面那一整套一行不动
  // ([c §7](../../../docs/v2/works/c-view.md#7-接缝切在哪))。
  //
  // 重放出来的那棵 DOM 整个 `pointer-events: none`(见 style)——
  // **点不到、选不中、链接也点不开**,事件全落在 #screen3 上,
  // 再翻译成 `Input.*`。只读是结构性的,不是靠自觉。
  let rrLoaded = null;
  function startDom() {
    img.hidden = true; dom3.hidden = false; screenEl = dom3;
    $("s-q").textContent = "DOM";
    if (!rrLoaded) {
      rrLoaded = new Promise((res, rej) => {
        const css = document.createElement("link");
        css.rel = "stylesheet"; css.href = "/api/rrweb.css" + auth;
        document.head.appendChild(css);
        const sc = document.createElement("script");
        sc.src = "/api/rrweb.js" + auth;
        sc.onload = res;
        sc.onerror = () => rej(new Error("重放器加载失败"));
        document.head.appendChild(sc);
      }).catch((err) => {
        // **不静默换一种。** 选了 DOM 而它起不来是个要修的事,
        // 不是该被悄悄绕过去的事。
        $("s-conn").textContent = "DOM 重放器加载失败"; $("s-conn").className = "bad";
        toast("DOM 重放器加载失败:" + err.message + " —— 换 --transport jpg 可以先用", 20000);
        throw err;
      });
    }
    return rrLoaded;
  }

  async function feedDom(e) {
    if (!rrLoaded) startDom();
    try { await rrLoaded; } catch (_) { return; }
    if (e.type === 4) {                       // Meta:新的一页,推倒重来
      if (replayer) { try { replayer.destroy(); } catch (_) {} replayer = null; }
      paintbox.innerHTML = "";                // **只清这个容器**,别动兄弟节点
      rrPending = [e];
      if (e.data && e.data.width) { frameW = e.data.width; frameH = e.data.height; }
      return;
    }
    if (!replayer) {
      rrPending.push(e);
      if (e.type !== 2) return;               // 等到全量快照才建得起来
      replayer = new rrweb.Replayer(rrPending, {
        root: paintbox, liveMode: true, mouseTail: false,
        UNSAFE_replayCanvas: true, insertStyleRules: [],
      });
      // **基线取"现在",不是快照的时间戳。** live 模式按 `事件时间 − 基线`
      // 排期;基线取十秒前那张快照的话,后面每条新事件都被排到十秒后才应用 ——
      // 表现是"点了没反应",而且不报错。
      replayer.startLive(Date.now());
      rrPending = [];
      fitDom();
      return;
    }
    try { replayer.addEvent(e); } catch (_) {}
  }

  function fitDom() {
    const wrap = paintbox.querySelector(".replayer-wrapper");
    if (!wrap) return;
    const r = dom3.getBoundingClientRect();
    if (r.width) wrap.style.transform = "scale(" + (r.width / (frameW || castW)) + ")";
  }
  addEventListener("resize", fitDom);

  // ------------------------------------------------------------ xpra 那条画面路
  // **只换像素从哪来。** 输入、光标、tab、原生 UI 上面那一整套一行不动
  // (works/11 §5)——所以这个函数只干三件事:换元素、连上去、把尺寸接过来。
  async function startXpra() {
    let XpraClient;
    try {
      ({ XpraClient } = await import("/static/xpra.js" + auth));
    } catch (err) {
      // **不静默回退到 screencast。** 选了 xpra 而它起不来,是个要修的事,
      // 不是一个该被悄悄绕过去的事(works/11 §6)。
      $("s-conn").textContent = "xpra 客户端加载失败"; $("s-conn").className = "bad";
      toast("xpra 客户端加载失败:" + err.message, 20000);
      return;
    }
    img.hidden = true; cvs.hidden = false; screenEl = cvs;
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    xpra = new XpraClient(proto + "//" + location.host + "/channel/xpra" + auth, cvs, {
      status: (st) => {
        $("s-conn").textContent = st === "ready" ? "已连接(xpra)"
          : st === "connected" ? "xpra 握手中…" : "xpra " + st;
        $("s-conn").className = (st === "error" || st === "closed") ? "bad" : "";
        if (st === "error" || st === "closed") screenEl.classList.add("dead");
      },
      size: (w, h) => {
        frameW = w; frameH = h;
        $("s-size").textContent = w + "×" + h;
        setSize(w, h);
      },
      log: (m) => toast(m, 12000),
    }).connect();
    $("s-q").textContent = "xpra";
    addEventListener("beforeunload", () => xpra && xpra.close());
  }

  // **帧的真实尺寸只有解码之后才知道。** CDP 的 metadata 报的是 CSS 尺寸,
  // dsf=2 时它说 1024×768,而图其实是 2048×1536 —— 拿它算"有效缩放"会差一倍,
  // 而那一栏正是用来判断该不该调 dsf 的(works/02 §4③)。
  img.addEventListener("load", () => {
    if (!img.naturalWidth) return;
    frameW = img.naturalWidth; frameH = img.naturalHeight;
    $("s-size").textContent = frameW + "×" + frameH;
    updateZoom();
  });

  function setSize(w, h) {
    castW = w; castH = h;
    // **显式定成 CSS 像素**。dsf>1 时帧是 2x 的,不写死会整个画面大一倍(works/02 §4③)
    screenEl.style.width = w + "px";
    screenEl.style.height = h + "px";
    screenEl.classList.remove("dead");
    updateZoom();
  }

  function updateZoom() {
    if (!frameW) return;
    // 有效缩放 = 物理像素 / 帧原始像素。1.00x 才是像素级对齐(works/02 §4③)
    const z = (screenEl.clientWidth * devicePixelRatio) / frameW;
    const el = $("s-zoom");
    el.textContent = z.toFixed(2) + "x";
    el.className = Math.abs(z - 1) < 0.02 ? "" : "bad";
  }

  function sendSize() {
    const st = document.getElementById("stage");
    send({ type: "resize", w: Math.max(320, st.clientWidth - 20),
           h: Math.max(240, st.clientHeight - 20) });
  }
  addEventListener("resize", () => { clearTimeout(window._rz);
    window._rz = setTimeout(sendSize, 250); updateZoom(); });

  // ---------------------------------------------------------------- 输入
  // 客户端只做归一化,翻译成 CDP Input.* 在服务端(works/03 §1)。
  const pt = (e) => {
    const r = screenEl.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (castW / r.width),
             y: (e.clientY - r.top) * (castH / r.height) };
  };
  const mods = (e) => (e.altKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) |
                      (e.metaKey ? 4 : 0) | (e.shiftKey ? 8 : 0);

  // **两个元素都绑。** 只有一个是可见的,事件只会从那个上来 ——
  // 比"切换时重新绑"少一个会忘的状态。
  for (const el of [img, cvs, dom3]) {
  el.addEventListener("mousemove", (e) => {
    const p = pt(e);
    queueInput({ type: "mouse", event: "move", ...p, buttons: e.buttons, modifiers: mods(e) });
  });
  el.addEventListener("mousedown", (e) => {
    e.preventDefault(); ime.focus();
    const p = pt(e);
    sendNow({ type: "mouse", event: "down", ...p, button: e.button, buttons: e.buttons,
           clicks: e.detail || 1, modifiers: mods(e) });
  });
  addEventListener("mouseup", (e) => {
    const p = pt(e);
    sendNow({ type: "mouse", event: "up", ...p, button: e.button, buttons: e.buttons,
           clicks: e.detail || 1, modifiers: mods(e) });
  });
  el.addEventListener("contextmenu", (e) => e.preventDefault());
  el.addEventListener("wheel", (e) => {
    e.preventDefault();
    const p = pt(e);
    queueInput({ type: "wheel", ...p, dx: e.deltaX, dy: e.deltaY, modifiers: mods(e) });
  }, { passive: false });
  }

  // IME:组字全在本地,`compositionend` 才发最终文本(works/03 §3)——
  // 这是 v2 相对 VNC 的净胜,不是打平。
  ime.addEventListener("compositionstart", () => { composing = true; });
  ime.addEventListener("compositionend", (e) => {
    composing = false;
    if (e.data) send({ type: "text", text: e.data });
    ime.value = "";
  });
  ime.addEventListener("keydown", (e) => {
    if (composing) return;                        // 组字期间一个按键都不发
    if (e.key === "Tab" || (e.ctrlKey && "wt".includes(e.key))) e.preventDefault();
    send({ type: "key", event: "down", key: e.key, code: e.code, modifiers: mods(e) });
  });
  ime.addEventListener("keyup", (e) => {
    if (composing) return;
    send({ type: "key", event: "up", key: e.key, code: e.code, modifiers: mods(e) });
  });
  ime.addEventListener("paste", (e) => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData("text");
    if (t) send({ type: "text", text: t });
  });
  ime.addEventListener("input", () => { if (!composing) ime.value = ""; });

  // ------------------------------------------------------ 六类原生 UI(works/06)
  // 它们在 headless 里根本不渲染 —— 不画,人就会遇到"点了没反应"。
  // 数据来自 /api/pending 和 /api/events,和上层自己画用的是同一组接口。
  const modal = $("modal"), card = $("card");
  let queue = [];

  function showNext() {
    const it = queue[0];
    if (!it) { modal.classList.remove("on"); ime.focus(); return; }
    modal.classList.add("on");
    if (it.kind === "dialog") {
      const prompt = it.subtype === "prompt";
      card.innerHTML = `<h3>页面弹了一个 ${it.subtype}</h3><p></p>` +
        (prompt ? `<input type=text id=dtext>` : "") +
        `<div class=row>${it.subtype === "alert" ? "" : "<button id=no>取消</button>"}
         <button class=go id=yes>确定</button></div>`;
      card.querySelector("p").textContent = it.text || "";
      if (prompt) { const i = card.querySelector("#dtext"); i.value = it.default || ""; i.focus(); }
      const answer = (accept) => {
        api("/tabs/" + it.tab + "/dialog", { method: "POST", body: JSON.stringify(
          { accept, text: prompt ? card.querySelector("#dtext").value : "" }) });
        queue.shift(); showNext();
      };
      card.querySelector("#yes").onclick = () => answer(true);
      const no = card.querySelector("#no"); if (no) no.onclick = () => answer(false);
    } else if (it.kind === "file") {
      card.innerHTML = `<h3>页面要选文件</h3><p>选一个传上去,或者取消。</p>
        <input type=file id=fpick ${it.mode === "selectMultiple" ? "multiple" : ""}>
        <div class=row><button id=fno>取消</button>
        <button class=go id=fyes>用它</button></div>`;
      const done = (names) => {
        api("/file-chooser/" + it.id, { method: "POST",
          body: JSON.stringify({ files: names }) });
        queue.shift(); showNext();
      };
      card.querySelector("#fno").onclick = () => done([]);
      card.querySelector("#fyes").onclick = async () => {
        const picked = [...card.querySelector("#fpick").files];
        const names = [];
        for (const f of picked) {
          const r = await api("/upload?name=" + encodeURIComponent(f.name),
                              { method: "POST", body: f });
          names.push(...(await r.json()).files);
        }
        done(names);
      };
    }
  }

  function enqueue(it) { queue.push(it); if (queue.length === 1) showNext(); }

  function toast(html, ms = 8000) {
    const el = document.createElement("div");
    el.className = "toast"; el.innerHTML = html;
    $("toasts").appendChild(el);
    setTimeout(() => el.remove(), ms);
  }

  async function loadPending() {
    try {
      const p = await (await api("/pending")).json();
      queue = [...(p.dialogs || []), ...(p.file_choosers || [])];
      showNext();
    } catch (e) {}
  }

  // ---------------------------------------------------------------- tab 条
  // 数据全部来自 /api/tabs 和 /api/events —— 和上层自己画用的是同一组接口。
  const api = (path, opt) => fetch("/api" + path + (auth && (path.includes("?") ? "&" + auth.slice(1) : auth)),
    { headers: { "content-type": "application/json" }, ...opt });

  async function loadTabs() {
    try {
      const r = await (await api("/tabs")).json();
      tabs = r.tabs || []; active = r.active;
      render();
    } catch (e) {}
  }

  function render() {
    const box = $("tabs");
    box.innerHTML = "";
    for (const t of tabs) {
      const el = document.createElement("div");
      el.className = "tab" + (t.active ? " on" : "");
      el.innerHTML = "<span></span><b>×</b>";
      el.firstChild.textContent = t.title || t.url || "新标签页";
      el.title = t.url || "";
      el.onclick = (e) => {
        if (e.target.tagName === "B") { api("/tabs/" + t.id, { method: "DELETE" }); return; }
        send({ type: "tab", id: t.id });
        targetHex = "";
      };
      box.appendChild(el);
      if (t.active) $("url").value = t.url || "";
    }
    const plus = document.createElement("div");
    plus.id = "newtab"; plus.textContent = "＋";
    plus.onclick = () => api("/tabs", { method: "POST", body: JSON.stringify({ url: "about:blank" }) });
    box.appendChild(plus);
  }

  $("url").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || !active) return;
    let u = $("url").value.trim();
    if (u && !/^[a-z]+:/i.test(u)) u = (u.includes(".") && !u.includes(" ")) ? "https://" + u
      : "https://www.google.com/search?q=" + encodeURIComponent(u);
    api("/tabs/" + active + "/goto", { method: "POST", body: JSON.stringify({ url: u }) });
    ime.focus();
  });
  for (const [id, verb] of [["back", "back"], ["fwd", "forward"], ["reload", "reload"]])
    $(id).onclick = () => active && api("/tabs/" + active + "/" + verb, { method: "POST" });

  function events() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const es = new WebSocket(proto + "//" + location.host + "/api/events" + auth);
    es.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type.startsWith("tab.")) loadTabs();
      else if (m.type === "dialog.opened" || m.type === "file.opened") enqueue(m);
      else if (m.type === "dialog.closed" || m.type === "file.closed") {
        // 别人回填了、或者超时了 —— 把我这边那张卡撤掉
        const n = queue.length;
        queue = queue.filter(q => q.id !== m.id);
        if (queue.length !== n) showNext();
      }
      else if (m.type === "download.began") toast("下载中 " + m.file);
      else if (m.type === "download.done" && m.state === "done")
        toast(`下载好了 <a href="/api/downloads/${m.id}${auth ? auth : ""}" download>${m.file}</a>`, 20000);
    };
    es.onclose = () => setTimeout(events, 2000);
  }

  // ---------------------------------------------------------------- 状态栏
  let xLast = { frames: 0, bytes: 0 };
  setInterval(() => {
    if (xpra) {                         // xpra 的帧不经过 onFrame,自己数
      const st = xpra.stats();
      frames = st.frames - xLast.frames; bytes = st.bytes - xLast.bytes;
      xLast = { frames: st.frames, bytes: st.bytes };
    }
    $("s-fps").textContent = frames;
    $("s-kbps").textContent = Math.round(bytes * 8 / 1000);
    frames = 0; bytes = 0;
  }, 1000);

  connect(); events(); loadTabs(); loadPending(); ime.focus();
})();
</script>
